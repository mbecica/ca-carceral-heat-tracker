# ============================================================================
# User-facing tooltip copy for the CA Carceral Facility Heat Tracker.
#
# This is the single home for tooltip prose. Edit the text here (in cowork or
# anywhere) — the site reads it on rebuild, no template changes needed.
#
# Placeholders filled in at render time (leave them in place):
#   {avg} — a statewide CDCR average count (e.g. "3,116")
#   {pct} — a statewide CDCR average percentage (e.g. "75%")
#
# Voice: see notes/website-voice-profile.md (local). Vulnerability-panel tooltips lead
# with the heat-risk mechanism (told in the carceral setting, with its source)
# and close with the statewide average as the final sentence.
# ============================================================================
tooltips:
  # Detail page — hourly chart (ⓘ next to "Hourly temperatures")
  chart: >-
    The shaded band shows the minimum and maximum temperatures recorded in this
    same two-week window across 2016–2025, and the median is the dashed line.
    Each 10°F above the average summer maximum at carceral facility sites is associated with a 5.2% rise in all-cause mortality
    (Skarha et al. 2023).

  # Detail page — CDCR flags under the overview grid (hover/focus on each pill)
  flag_california_model: >-
    CDCR lists this prison as part of the California Model, its version of the
    Norwegian corrections approach (CDCR Infrastructure Master Plan 2026).

  flag_air_cooling_pilot: >-
    One of three prisons in CDCR's Air Cooling Pilot Program, funded in the
    2025 Budget Act to evaluate air cooling alternatives in housing units
    (CDCR 2026).

  flag_infrastructure_priority: >-
    CDCR's May 2026 Infrastructure Master Plan names five prisons that "would
    require significant capital improvement projects" in the next five years,
    including replacing utility systems and housing units. This prison is one
    of them.

  # Detail page — CDCR cooling section (ⓘ next to "Cooling in housing units")
  cooling: >-
    The pie chart shows housing units by cooling type, from CDCR's Air Cooling
    Pilot Program supplemental report, January 2026 (conditions as of December
    2025). Mechanical A/C is refrigerated air conditioning. Evaporative ("swamp")
    coolers cool air by evaporating water. No cooling means air handlers only,
    which move air without cooling it. CDCR says air handlers and evaporative
    systems do not "provide adequate relief from excessive heat." Housing units
    with more than one kind of cooling are counted under each, so the shares can
    add up to more than 100%.

  # Detail page — ⓘ on "Cooling in non-housing buildings", shown when a cooling type is
  # rated at the prison but counted in none of its housing units.
  #   {types} — "This cooling type is" or "These cooling types are"
  cooling_outside_housing: >-
    {types} documented at this prison (CDCR 2026 condition assessment) but in
    none of its housing units (CDCR Air Cooling report, December 2025).

  # Appended to the note above at CIM only
  cooling_outside_housing_cim: >-
    CIM had an evaporative cooling retrofit at Facility A completed in February
    2025 that is not reflected in CDCR's Air Cooling report.

  # Detail page — ⓘ on the "Infrastructure Condition" subhead (the 2026 rating guide)
  cooling_condition: >-
    Ratings from CDCR's May 2026 Infrastructure Master Plan, assigned by each
    prison's plant operations staff. CDCR's rating definitions: Plus: expected
    to last more than 20 years. Good: generally well maintained. Fair: needs
    repairs, typical wear and tear. Poor: significant disrepair. Failing: at
    risk of failure or unusable.

  # Detail page — CDCR "Heat Vulnerabilities" section (ⓘ next to the heading)
  vulnerabilities_intro: >-
    These are the shares of people held here who face elevated heat-health risk;
    hover on each to learn why that demographic matters for heat risk and how this
    prison compares with the rest of CDCR. Data is a 2025 average.

  # Detail page — the vulnerability "madlib" numbers (each is an underlined stat)
  population: "An average of {avg} people were incarcerated per CDCR prison in 2025."

  people_of_color: >-
    People of color face more heat inequity in their home communities and more
    often enter prison living with heat-vulnerable illnesses (Hamstead 2023;
    Jackson et al. 2022). On average in 2025, {pct} of incarcerated people in CDCR
    prisons were people of color.

  age_over_50: >-
    Older age weakens the body's ability to regulate heat and adds cardiovascular
    strain. Because incarceration accelerates aging, these effects set in nearer 50
    in carceral environments (Singh et al. 2024; Novisky 2025). On average in 2025, 
    {pct} of incarcerated people in CDCR prisons were 50 or older.

  mental_health: >-
    The psychotropic medications involuntarily prescribed for mental-health care in
    prisons impair the body's ability to cool itself (Singh et al. 2024; Brunn et
    al. 2025). On average in 2025, {pct} of incarcerated people in CDCR prisons 
    received enhanced outpatient mental-health care. CDCR does not release data on 
    the heat-risk population taking these medications, so this enhanced-outpatient-care 
    share serves as a heat-vulnerability proxy, alongside the medical-risk category.

  disability: >-
    Disability can dull the body's ability to sense heat and to sweat. People with
    limited mobility often cannot reach water or a cooler space, and that movement is
    more restricted in carceral settings (Brunn et al. 2025). On average in 2025,
    {pct} of incarcerated people in CDCR prisons were in the disability placement program.
    There is no published data on disability rates in CDCR prisons; this metric is a
    proxy.

  medical_risk: >-
    Chronic illness impairs the body's ability to regulate heat and raises the risk of
    heat death (CCHCS 2025; Singh et al. 2024). CCHCS' Medium Risk category approximates
    the number of incarcerated people with one or more chronic illness. On average in 2025,
    {pct} of incarcerated people in CDCR prisons fell in a medium or higher medical-risk
    category. CDCR has not published heat-vulnerable population counts, so this 
    medium-or-higher medical-risk share serves as a heat-vulnerability proxy. 

  womens_facility: >-
    This one of two women's CDCR facilities. Women's bodies cool themselves less 
    efficiently as they age, and heat is especially dangerous for menopausal women 
    of color in prison (Leach et al. 2024; Kerrison 2026).
